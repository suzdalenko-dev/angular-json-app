
<div class="counter">
  <div>
  <input
    type="button"
    value="−"
    (click)="counterService.decrement()"
  >

  <input
    type="text"
    [value]="counterService.count()"
    readonly
  >

  <input
    type="button"
    value="+"
    (click)="counterService.increment()"
  >
  <div>
  <div>
    @if (posts[counterService.count()]; as post) {
      <p>Publicación: {{ post.title }}</p>
    }
  </div>
</div>
<br>
